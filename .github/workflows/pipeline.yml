name: Vehicle Engine Maintenance Prediction CI/CD Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r CapstonePredictiveMaintenance/requirements.txt
      - name: Register Dataset
        run: python CapstonePredictiveMaintenance/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: CapstonePredictiveMaintenance/data/engine_data.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r CapstonePredictiveMaintenance/requirements.txt
      - name: Run Data Preparation
        run: python CapstonePredictiveMaintenance/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
             CapstonePredictiveMaintenance/data/processed/Xtrain.csv
             CapstonePredictiveMaintenance/data/processed/Xtest.csv
             CapstonePredictiveMaintenance/data/processed/ytrain.csv
             CapstonePredictiveMaintenance/data/processed/ytest.csv
             CapstonePredictiveMaintenance/data/processed/preparation_run_id.txt

  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r CapstonePredictiveMaintenance/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: CapstonePredictiveMaintenance/data/processed/

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server starts
      - name: Model Building
        run: python CapstonePredictiveMaintenance/model_building/train.py
      - name: Validate 2 Decimal Rounding
        run: python CapstonePredictiveMaintenance/model_building/validate_rounding.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CapstonePredictiveMaintenance/deployment/best_engine_condition_pipeline.joblib   # path to the saved model file
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
